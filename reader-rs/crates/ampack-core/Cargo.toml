[package]
name = "ampack-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish = true
description = "Verify and read ampack memory packs for AI agents: an independent, strict verifier of the format, no_std with alloc."
readme = "README.md"
keywords = ["ampack", "memory-pack", "agent-memory", "verification", "signature"]
categories = ["cryptography", "no-std", "parser-implementations"]
build = "build.rs"
# registry.json, LICENSE and NOTICE are copies made by ../../sync_sources.py when the crate is packaged.
include = ["src/**", "build.rs", "Cargo.toml", "README.md", "registry.json", "LICENSE", "NOTICE"]

[dependencies]
# Exact pins: the verdicts depend on these tables and checks (feature 18, 3.2).
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa"] }
sha2 = { version = "=0.10.9", default-features = false }
unicode-normalization = { version = "=0.1.22", default-features = false }
# zlib's own inflater (a port of zlib), so a stream is valid exactly when the .NET and Python verifiers' zlib says so
# (review 18, H1: miniz_oxide accepted an incomplete distance code that zlib refuses).
zlib-rs = { version = "=0.6.8", default-features = false, features = ["rust-allocator"] }
