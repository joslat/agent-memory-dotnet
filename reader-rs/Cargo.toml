[workspace]
resolver = "2"
members = ["crates/ampack-core", "crates/ampack-cli", "crates/ampack-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Jose Luis Latorre Millas"]
homepage = "https://memcert.dev"
repository = "https://github.com/joslat/agent-memory-dotnet"
# Nothing is published unless a crate says so itself: ampack-core and ampack (the command line) do, ampack-wasm does not.
publish = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
# A size that wraps is a refusal, never a silent wrong answer (review 18, H2: usize is 32 bits on wasm32).
overflow-checks = true
strip = true
