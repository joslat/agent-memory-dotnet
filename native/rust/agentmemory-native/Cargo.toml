[package]
name = "agentmemory-native"
description = "Safe Rust API of the AgentMemory native library: owner-scoped recall and journaled writes over its C ABI, no .NET needed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
readme = "../README.md"
keywords = ["agentmemory", "memory", "agents", "neo4j", "ffi"]
categories = ["api-bindings", "database"]

[features]
default = []
# Futures over the same waiter thread: std futures and wakers only, for any executor.
async = []

[dependencies]
agentmemory-native-sys.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
