# Memory on: Neo4j with a persistent volume, the schema step (the managed AgentMemory command line, run once per
# start, idempotent), and the speech server reading its AgentMemory configuration from a secret file. Passwords live
# only in files that recipe.sh writes with owner-only permissions; none is in an environment variable or a command line.
services:
  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5.26}
    environment:
      NEO4J_AUTH_FILE: /run/secrets/neo4j_auth
    secrets: [neo4j_auth]
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$(cut -d/ -f2- /run/secrets/neo4j_auth)\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 10s
    restart: unless-stopped

  schema:
    image: ${SCHEMA_IMAGE:?SCHEMA_IMAGE is required with memory on}
    depends_on:
      neo4j: {condition: service_healthy}
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:?EMBEDDING_DIMENSIONS is required}
    secrets: [neo4j_password]
    restart: "no"

  speech:
    depends_on:
      schema: {condition: service_completed_successfully}
    environment:
      S2S_MEMORY_CONFIG: /run/secrets/agentmemory_config
      S2S_MEMORY_DEADLINE_MS: ${MEMORY_DEADLINE_MS:-450}
    secrets: [agentmemory_config]

secrets:
  neo4j_auth:
    file: ${SECRETS_DIR:?SECRETS_DIR is required}/neo4j_auth
  neo4j_password:
    file: ${SECRETS_DIR}/neo4j_password
  agentmemory_config:
    file: ${SECRETS_DIR}/agentmemory.json

volumes:
  neo4j-data:
    name: ${NEO4J_DATA_VOLUME:-agentmemory-speech-neo4j}
