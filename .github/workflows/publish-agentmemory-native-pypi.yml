# Uploads the AgentMemory native library for Python (agentmemory-native: native/python with the Native AOT library
# inside) to PyPI, one wheel per platform: Linux x86-64 and ARM64 (glibc 2.34), macOS on Apple silicon, Windows x64.
#
# No key is stored. PyPI accepts a short-lived proof from GitHub that this workflow file, in this repository and in the
# 'pypi' environment, is the publisher its project 'agentmemory-native' names (Trusted Publishing). The file name, the
# repository and the environment are what PyPI checks: renaming any of them breaks the upload until PyPI's setting is
# changed too. The upload job must stay in this file: PyPI does not accept a proof from a called (reusable) workflow.
#
# It runs only when it is started by hand (Actions, "Publish agentmemory-native (PyPI)", Run workflow). It calls the
# four-platform workflow (native-platforms.yml), which builds the library on each platform's own runner, checks the
# compiler, the manifest and the macOS signature, runs the gate's tiers A to C and S, and installs each wheel into a clean
# environment for the read gate against a real, seeded Neo4j. Only if all of that passes does the wheels job collect the
# four wheels, check that there are exactly four, one per platform, all of the version in the source, and run the
# index's strict metadata check. The upload job then waits for the reviewer of the 'pypi' environment, so nothing leaves
# without a click.
name: Publish agentmemory-native (PyPI)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-agentmemory-native-pypi
  cancel-in-progress: false

jobs:
  platforms:
    name: Build and gate
    uses: ./.github/workflows/native-platforms.yml

  wheels:
    name: Collect and check the four wheels
    needs: platforms
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Fetch the platforms' files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agentmemory-native-*
          path: platforms/

      # The gated wheels only: each platform's build artifact keeps its wheel under wheel/.
      - name: Exactly four wheels, one per platform, of the source's version
        run: |
          mkdir -p dist
          find platforms -path '*/wheel/*.whl' -exec cp {} dist/ \;
          python - <<'EOF'
          import pathlib, re, sys
          source = pathlib.Path("native/python/agentmemory_native/__init__.py").read_text(encoding="utf-8")
          version = re.search(r'__version__ = "([^"]+)"', source).group(1)
          wheels = sorted(p.name for p in pathlib.Path("dist").glob("*.whl"))
          print("version in the source:", version)
          for w in wheels: print("  ", w)
          patterns = [r"manylinux_2_34_x86_64", r"manylinux_2_34_aarch64", r"macosx_\d+_\d+_arm64", r"win_amd64"]
          problems = []
          if len(wheels) != 4: problems.append(f"expected 4 wheels, found {len(wheels)}")
          for w in wheels:
              m = re.fullmatch(r"agentmemory_native-([^-]+)-py3-none-(.+)\.whl", w)
              if not m: problems.append(f"unexpected file name: {w}"); continue
              if m.group(1) != version: problems.append(f"{w}: version {m.group(1)}, the source says {version}")
          for p in patterns:
              if sum(1 for w in wheels if re.search(p + r"\.whl$", w)) != 1: problems.append(f"not exactly one wheel for {p}")
          if problems:
              print("\n".join("PROBLEM: " + x for x in problems)); sys.exit(1)
          EOF

      - name: Check the metadata
        run: |
          python -m pip install --disable-pip-version-check "twine==7.0.0"
          python -m twine check --strict dist/*

      - name: Keep the wheels for the upload job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentmemory-native-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Upload to PyPI
    needs: wheels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/agentmemory-native/
    permissions:
      id-token: write     # the short-lived proof PyPI checks; nothing else
    steps:
      - name: Fetch the checked wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agentmemory-native-dist
          path: dist/

      - name: Upload
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
