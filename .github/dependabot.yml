version: 2
updates:
  # AgentMemory.slnx at the repo root pulls in every src/, tests/, samples/, and tools/ project.
  - package-ecosystem: "nuget"
    directory: "/"
    # Actions minutes are scarce: every open Dependabot PR re-ran full CI each time main moved. One grouped PR a
    # month, never rebased automatically; the bumps are folded into the next release branch and tested there.
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      microsoft-ai:
        patterns:
          - "Microsoft.SemanticKernel*"
          - "Microsoft.Agents.AI*"
      azure:
        patterns:
          - "Azure.*"
      neo4j:
        patterns:
          - "Neo4j.*"
          - "Testcontainers.Neo4j"
      xunit:
        patterns:
          - "xunit*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    groups:
      actions:
        patterns:
          - "*"
