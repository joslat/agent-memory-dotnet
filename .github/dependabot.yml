version: 2
updates:
  # AgentMemory.slnx at the repo root pulls in every src/, tests/, samples/, and tools/ project.
  - package-ecosystem: "nuget"
    directory: "/"
    # Actions minutes are scarce: every open Dependabot PR re-ran full CI each time main moved. One grouped PR a
    # month, never rebased automatically; the bumps are folded into the next release branch and tested there.
    # One group for everything: with several groups and a limit of 1, the bumps outside the first group would wait.
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    groups:
      nuget:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    groups:
      actions:
        patterns:
          - "*"
