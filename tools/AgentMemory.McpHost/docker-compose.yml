# A complete, runnable stack: Neo4j plus the MCP server, from nothing.
#
#   AZURE_OPENAI_ENDPOINT=... AZURE_OPENAI_API_KEY=... \
#     docker compose -f tools/AgentMemory.McpHost/docker-compose.yml up
#
# Then point an MCP client at http://localhost:5233.
services:
  neo4j:
    image: neo4j:5.26
    environment:
      # Matches the version the test suite and every recorded measurement run against. Vector index
      # behaviour differs between 5.x minors, so the pin is deliberate rather than incidental.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-agentmemory}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      # The server bootstraps the schema at startup and exits non-zero if it cannot, so it must not
      # start before the database can answer. Without this the first run fails on a cold volume and
      # succeeds on the second attempt, which is the most confusing possible first impression.
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  agent-memory-mcp:
    build:
      context: ../..
      dockerfile: tools/AgentMemory.McpHost/Dockerfile
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-agentmemory}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:?set AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:?set AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-text-embedding-3-small}
      # Uncomment to expose only the 9 tools that read.
      # AGENT_MEMORY_MCP_READ_ONLY: "true"
    ports:
      - "5233:5233"

volumes:
  neo4j-data:
