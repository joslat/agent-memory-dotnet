# A complete, runnable stack: Neo4j plus the MCP server, from nothing.
#
#   BITDEER_API_KEY=... \
#     docker compose -f tools/AgentMemory.McpHost/docker-compose.yml up
#
# Any supported provider works: set its variables in your shell and they pass through (one variable
# for Bitdeer; AZURE_OPENAI_* still works unchanged). Variables you do not set stay unset in the
# container, so auto-detection sees exactly your provider.
#
# Then point an MCP client at http://localhost:5233. HTTP has no authentication, so every port below
# is published on localhost only.
services:
  neo4j:
    image: neo4j:5.26
    environment:
      # Matches the version the test suite and every recorded measurement run against. Vector index
      # behaviour differs between 5.x minors, so the pin is deliberate rather than incidental.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-agentmemory}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      # The server bootstraps the schema at startup and exits non-zero if it cannot, so it must not
      # start before the database can answer. Without this the first run fails on a cold volume and
      # succeeds on the second attempt, which is the most confusing possible first impression.
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  agent-memory-mcp:
    build:
      context: ../..
      dockerfile: tools/AgentMemory.McpHost/Dockerfile
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-agentmemory}
      # Inference: names without a value are copied from your shell when set and left unset otherwise.
      - AI_INFERENCE_PROVIDER
      - AI_EMBEDDING_PROVIDER
      - AI_EMBEDDING_MODEL
      - AI_EMBEDDING_ENDPOINT
      - AI_EMBEDDING_API_KEY
      - AI_EMBEDDING_DIMENSIONS
      - AGENTMEMORY_EXTRACTION_MODEL
      - BITDEER_API_KEY
      - BITDEER_MODEL
      - BITDEER_EMBEDDING_MODEL
      - AZURE_OPENAI_ENDPOINT
      - AZURE_OPENAI_API_KEY
      - AZURE_OPENAI_DEPLOYMENT
      - AZURE_OPENAI_EMBEDDING_DEPLOYMENT
      - AZURE_OPENAI_EXTRACTION_DEPLOYMENT
      - OPENAI_API_KEY
      - OPENAI_MODEL
      - OPENAI_EMBEDDING_MODEL
      - FOUNDRY_ENDPOINT
      - FOUNDRY_API_KEY
      - FOUNDRY_MODEL
      - FOUNDRY_EMBEDDING_MODEL
      - OPENAI_COMPATIBLE_ENDPOINT
      - OPENAI_COMPATIBLE_MODEL
      - OPENAI_COMPATIBLE_EMBEDDING_MODEL
      - OPENAI_COMPATIBLE_API_KEY
      # Pin every call to one owner (recommended for a personal server).
      - AGENT_MEMORY_MCP_OWNER
      # Set to true to expose only the tools that read.
      - AGENT_MEMORY_MCP_READ_ONLY
    ports:
      - "127.0.0.1:5233:5233"

volumes:
  neo4j-data:
